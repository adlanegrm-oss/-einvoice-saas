<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Nouveau mot de passe - eInvoice SaaS</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #0f172a; font-family: 'Segoe UI', system-ui, sans-serif; color: #e2e8f0; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 28px; width: 380px; max-width: 92vw; }
        h1 { margin: 0 0 6px; font-size: 1.15rem; color: #38bdf8; }
        p { margin: 0 0 16px; font-size: 0.85rem; color: #94a3b8; }
        label { display: block; font-size: 0.8rem; margin: 12px 0 4px; }
        input { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        button { margin-top: 18px; width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #0284c7; color: #fff; font-weight: 600; cursor: pointer; }
        button:disabled { opacity: .6; cursor: default; }
        #msg { margin-top: 14px; font-size: 0.85rem; min-height: 1.2em; }
        .ok { color: #4ade80; } .err { color: #f87171; }
        a { color: #38bdf8; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Choisir un nouveau mot de passe</h1>
        <p>10 caractères minimum. Ce lien est valable 15 minutes et ne fonctionne qu'une fois.</p>
        <form id="form" autocomplete="off">
            <label for="pw1">Nouveau mot de passe</label>
            <input type="password" id="pw1" minlength="10" required autocomplete="new-password">
            <label for="pw2">Confirmer le mot de passe</label>
            <input type="password" id="pw2" minlength="10" required autocomplete="new-password">
            <button type="submit" id="btn">Enregistrer</button>
        </form>
        <div id="msg" role="status"></div>
    </main>

    <script>
        const token = new URLSearchParams(location.search).get('token') || '';
        // Retire le jeton de la barre d'adresse et de l'historique.
        history.replaceState(null, '', location.pathname);

        const msg = document.getElementById('msg');
        function show(text, cls) { msg.textContent = text; msg.className = cls; }

        if (!token) show('Lien invalide. Refaites une demande depuis la page de connexion.', 'err');

        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pw1 = document.getElementById('pw1').value;
            const pw2 = document.getElementById('pw2').value;
            if (!token) return;
            if (pw1 !== pw2) { show('Les deux mots de passe ne correspondent pas.', 'err'); return; }

            const btn = document.getElementById('btn');
            btn.disabled = true;
            try {
                const res = await fetch('/api/v1/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, password: pw1 })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) {
                    show('Mot de passe mis à jour. Redirection vers la connexion…', 'ok');
                    setTimeout(() => { location.href = '/login.html'; }, 1500);
                } else {
                    show(data.error || 'Échec de la réinitialisation.', 'err');
                    btn.disabled = false;
                }
            } catch (err) {
                show('Erreur de communication avec le serveur.', 'err');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
