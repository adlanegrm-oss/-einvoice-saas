<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Invoice SaaS - Front & Back Office</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
    <div class="min-h-screen flex flex-col">
        <!-- Navigation Bar -->
        <header class="bg-indigo-700 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold">e-Invoice SaaS</h1>
                <div class="flex items-center gap-2">
                    <label class="text-sm">Clé API :</label>
                    <input type="password" id="apiKey" value="secret-api-key-123" class="px-3 py-1 rounded bg-indigo-800 border border-indigo-500 text-sm focus:outline-none">
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- BACK OFFICE: Dashboard & Métriques -->
            <div class="md:col-span-3 grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-lg shadow border-l-4 border-indigo-600">
                    <p class="text-sm text-gray-500 font-medium">Factures du jour</p>
                    <p id="metricCount" class="text-2xl font-bold text-gray-900">0</p>
                </div>
                <div class="bg-white p-5 rounded-lg shadow border-l-4 border-blue-600">
                    <p class="text-sm text-gray-500 font-medium">Chiffre d'Affaires HT</p>
                    <p id="metricHT" class="text-2xl font-bold text-gray-900">0.00 €</p>
                </div>
                <div class="bg-white p-5 rounded-lg shadow border-l-4 border-green-600">
                    <p class="text-sm text-gray-500 font-medium">Total TTC (Factur-X)</p>
                    <p id="metricTTC" class="text-2xl font-bold text-gray-900">0.00 €</p>
                </div>
            </div>

            <!-- FRONT OFFICE: Formulaire Nouvelle Facture -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h2 class="text-lg font-semibold mb-4 text-indigo-700 border-b pb-2">Créer une Facture</h2>
                <form id="invoiceForm" onsubmit="submitInvoice(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-700">ID Facture</label>
                        <input type="text" id="invId" required class="w-full px-3 py-1.5 border rounded text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Numéro Facture</label>
                        <input type="text" id="invNum" placeholder="INV-2026-001" required class="w-full px-3 py-1.5 border rounded text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700">Client</label>
                        <input type="text" id="invCustomer" placeholder="Nom de l'entreprise" required class="w-full px-3 py-1.5 border rounded text-sm">
                    </div>
                    <div class="border-t pt-2 mt-2">
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Article</label>
                        <input type="text" id="itemDesc" placeholder="Description" required class="w-full px-3 py-1.5 border rounded text-sm mb-2">
                        <div class="grid grid-cols-3 gap-2">
                            <input type="number" id="itemQty" placeholder="Qté" value="1" min="1" required class="px-2 py-1 border rounded text-sm">
                            <input type="number" step="0.01" id="itemPrice" placeholder="Prix HT" required class="px-2 py-1 border rounded text-sm">
                            <input type="number" step="0.1" id="itemVAT" placeholder="TVA %" value="20" required class="px-2 py-1 border rounded text-sm">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded text-sm font-medium transition">Valider & Enregistrer</button>
                </form>
                <div id="formMsg" class="mt-3 text-xs text-center hidden"></div>
            </div>

            <!-- BACK OFFICE: Liste des Factures & Export -->
            <div class="md:col-span-2 bg-white p-6 rounded-lg shadow flex flex-col">
                <div class="flex justify-between items-center border-b pb-2 mb-4">
                    <h2 class="text-lg font-semibold text-indigo-700">Registre des Factures</h2>
                    <button onclick="loadData()" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded border">Actualiser</button>
                </div>
                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-gray-50 text-gray-600 uppercase border-b">
                            <tr>
                                <th class="p-2">Numéro</th>
                                <th class="p-2">Client</th>
                                <th class="p-2">HT</th>
                                <th class="p-2">TTC</th>
                                <th class="p-2 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="invoiceTable" class="divide-y">
                            <tr>
                                <td colspan="5" class="p-4 text-center text-gray-400">Aucune facture enregistrée</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <script>
        function getHeaders() {
            const key = document.getElementById('apiKey').value;
            return {
                'Content-Type': 'application/json',
                'X-API-Key': key
            };
        }

        async function loadData() {
            try {
                // Charger rapport journalier
                const repRes = await fetch('/reports/daily', { headers: getHeaders() });
                if (repRes.ok) {
                    const rep = await repRes.json();
                    document.getElementById('metricCount').innerText = rep.total_invoices || 0;
                    document.getElementById('metricHT').innerText = (rep.total_ht || 0).toFixed(2) + ' €';
                    document.getElementById('metricTTC').innerText = (rep.total_ttc || 0).toFixed(2) + ' €';
                }

                // Charger liste factures
                const invRes = await fetch('/invoices', { headers: getHeaders() });
                if (invRes.ok) {
                    const invoices = await invRes.json();
                    const tbody = document.getElementById('invoiceTable');
                    if (!invoices || invoices.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-400">Aucune facture enregistrée</td></tr>';
                        return;
                    }
                    tbody.innerHTML = invoices.map(inv => `
                        <tr class="hover:bg-gray-50">
                            <td class="p-2 font-medium">${inv.number}</td>
                            <td class="p-2">${inv.customer}</td>
                            <td class="p-2">${inv.total_ht.toFixed(2)} €</td>
                            <td class="p-2 font-bold">${inv.total_ttc.toFixed(2)} €</td>
                            <td class="p-2 text-right">
                                <a href="/invoices/export/xml?id=${inv.id}" target="_blank" onclick="event.preventDefault(); downloadXML('${inv.id}', '${inv.number}')" class="text-indigo-600 hover:underline">Export Factur-X</a>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function downloadXML(id, num) {
            const key = document.getElementById('apiKey').value;
            const res = await fetch(`/invoices/export/xml?id=${id}`, {
                headers: { 'X-API-Key': key }
            });
            if (res.ok) {
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `factur-x-${num}.xml`;
                a.click();
            } else {
                alert("Erreur d'exportation (Clé API invalide ?)");
            }
        }

        async function submitInvoice(e) {
            e.preventDefault();
            const msg = document.getElementById('formMsg');
            msg.className = "mt-3 text-xs text-center";

            const inv = {
                id: document.getElementById('invId').value,
                number: document.getElementById('invNum').value,
                customer: document.getElementById('invCustomer').value,
                items: [{
                    description: document.getElementById('itemDesc').value,
                    quantity: parseInt(document.getElementById('itemQty').value),
                    unit_price: parseFloat(document.getElementById('itemPrice').value),
                    vat_rate: parseFloat(document.getElementById('itemVAT').value)
                }]
            };

            const res = await fetch('/invoices/validate', {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify(inv)
            });

            if (res.ok) {
                msg.innerText = "Facture enregistrée avec succès !";
                msg.classList.add("text-green-600");
                document.getElementById('invoiceForm').reset();
                loadData();
            } else {
                const err = await res.json();
                msg.innerText = "Erreur: " + (err.error || "Échec");
                msg.classList.add("text-red-600");
            }
            msg.classList.remove("hidden");
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
