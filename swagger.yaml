openapi: 3.0.3
info:
  title: Electronic Invoicing Validation SaaS API
  description: >
    API B2B de Facturation Électronique Multi-Normes (Factur-X/CII, UBL, EDIFACT, IDDoc, PDF Signé PAdES)
    avec gestion du registre, rapports financiers et module de Clearance fiscale.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Serveur Local de Développement
  - url: https://api.einvoice-saas.com
    description: Serveur de Production

security:
  - ApiKeyAuth: []
  - BearerAuth: []

paths:
  /api/v1/health:
    get:
      summary: Bilan de santé du service
      description: Endpoint public pour vérifier la santé de l'API et la connexion à SQLite.
      security: []
      responses:
        '200':
          description: Le service fonctionne normalement.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "up"
                  database:
                    type: string
                    example: "connected"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-09-24T16:30:00Z"

  /api/v1/validate:
    post:
      summary: Validation binaire unifiée multi-formats
      description: Valide la conformité d'un fichier de facture électronique (Factur-X, UBL, EDIFACT, IDDoc, PAdES).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - format
                - file
              properties:
                format:
                  type: string
                  enum: [FACTUR-X, UBL, EDIFACT, IDDOC, PADES]
                  example: "FACTUR-X"
                file:
                  type: string
                  format: binary
                  description: Fichier XML ou PDF à valider.
      responses:
        '200':
          description: Résultat de la validation binaire et structurelle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400':
          description: Format de fichier invalide ou corrompu.
        '401':
          description: Non autorisé (Clé API ou Token manquant).

  /api/v1/invoices:
    get:
      summary: Liste des factures du registre
      description: Récupère la liste des factures enregistrées dans la base de données.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [DRAFT, PENDING_CLEARANCE, CLEARED, REJECTED]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Liste des factures.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 42
                  invoices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
        '401':
          description: Non autorisé.

    post:
      summary: Enregistrer une nouvelle facture
      description: Crée une nouvelle facture dans le registre du SaaS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceInput'
      responses:
        '201':
          description: Facture créée avec succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          description: Données de facture invalides.
        '401':
          description: Non autorisé.

  /api/v1/invoices/{id}:
    get:
      summary: Consulter une facture par ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Détails complets de la facture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          description: Facture non trouvée.

    delete:
      summary: Supprimer / Annuler une facture
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Facture supprimée avec succès.
        '404':
          description: Facture non trouvée.

  /api/v1/invoices/{id}/clear:
    post:
      summary: Soumettre une facture pour clearance fiscale
      description: Soumet la facture au service de contrôle transactionnel continu pour validation fiscale et génération du QR code.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Facture validée et scellée (CLEARED) par l'autorité fiscale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearanceResult'
        '400':
          description: Erreur de structure ou calculs de TVA non conformes.
        '422':
          description: Rejet explicite par l'autorité fiscale.

  /api/v1/reports:
    get:
      summary: Rapport financier journalier
      description: Calcule les totaux financiers (HT, TVA, TTC) agrégés en SQLite pour une journée donnée.
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
            example: "2026-09-24"
      responses:
        '200':
          description: Rapport financier quotidien.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialReport'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
          example: true
        format:
          type: string
          example: "FACTUR-X"
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string

    InvoiceInput:
      type: object
      required:
        - invoice_number
        - seller_siret
        - buyer_siret
        - total_ht
        - total_tva
        - total_ttc
        - currency
        - items
      properties:
        invoice_number:
          type: string
          example: "INV-2026-001"
        seller_siret:
          type: string
          example: "12345678900012"
        buyer_siret:
          type: string
          example: "98765432100099"
        issue_date:
          type: string
          format: date
          example: "2026-09-24"
        due_date:
          type: string
          format: date
          example: "2026-10-24"
        currency:
          type: string
          example: "EUR"
        total_ht:
          type: number
          format: double
          example: 1000.00
        total_tva:
          type: number
          format: double
          example: 200.00
        total_ttc:
          type: number
          format: double
          example: 1200.00
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'

    Invoice:
      type: object
      properties:
        id:
          type: string
          example: "inv_987654321"
        invoice_number:
          type: string
          example: "INV-2026-001"
        seller_siret:
          type: string
          example: "12345678900012"
        buyer_siret:
          type: string
          example: "98765432100099"
        status:
          type: string
          enum: [DRAFT, PENDING_CLEARANCE, CLEARED, REJECTED]
          example: "CLEARED"
        total_ht:
          type: number
          format: double
          example: 1000.00
        total_tva:
          type: number
          format: double
          example: 200.00
        total_ttc:
          type: number
          format: double
          example: 1200.00
        clearance_id:
          type: string
          example: "CLR-2026-987654321"
        cleared_at:
          type: string
          format: date-time
          example: "2026-09-24T16:00:00Z"
        created_at:
          type: string
          format: date-time
          example: "2026-09-24T15:30:00Z"

    InvoiceItem:
      type: object
      required:
        - description
        - quantity
        - unit_price
        - tva_rate
      properties:
        description:
          type: string
          example: "Service de développement Go"
        quantity:
          type: number
          example: 10
        unit_price:
          type: number
          example: 100.00
        tva_rate:
          type: number
          example: 20.00

    ClearanceResult:
      type: object
      properties:
        clearance_id:
          type: string
          example: "CLR-2026-987654321"
        status:
          type: string
          enum: [CLEARED, REJECTED]
          example: "CLEARED"
        qr_code_data:
          type: string
          example: "https://tax.gov/verify?id=CLR-2026-987654321"
        cleared_at:
          type: string
          format: date-time
          example: "2026-09-24T16:00:00Z"
        errors:
          type: array
          items:
            type: string

    FinancialReport:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2026-09-24"
        total_invoices:
          type: integer
          example: 15
        total_ht:
          type: number
          example: 15000.00
        total_tva:
          type: number
          example: 3000.00
        total_ttc:
          type: number
          example: 18000.00
        cleared_count:
          type: integer
          example: 12
        rejected_count:
          type: integer
          example: 1
