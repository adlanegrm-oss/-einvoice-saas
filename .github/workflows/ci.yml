name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Format Check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Fichiers non formates detectes :"
            echo "$unformatted"
            exit 1
          fi

      - name: Static Analysis (go vet)
        run: go vet ./...

      - name: Race Detection & Tests
        run: go test -race -count=1 -v ./...

      - name: Build All Binaries
        run: go build -v ./...
