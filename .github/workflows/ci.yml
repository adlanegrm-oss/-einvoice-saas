name: Certification CI & Security Audit

on:
  push:
    branches: [ main, develop, 'certification/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Code Sanity & Normative Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify Code Formatting
        run: |
          test -z "$(gofmt -l .)" || (echo "Unformatted files found:" && gofmt -l . && exit 1)

      - name: Go Vet
        run: go vet ./pkg/... ./internal/...

      - name: Run Test Suites
        run: go test -v -race -p 1 ./pkg/... ./internal/...

  security-audit:
    name: Vulnerability, SBOM & Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
