version: '3.8'

networks:
  frontend_net:
    driver: bridge
  backend_net:
    internal: true # Aucun accès sortant ou entrant direct depuis l'extérieur

services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - einvoice-core

  einvoice-core:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DB_PATH=/data/invoices.db
      - SCHEMATRON_ENDPOINT=http://schematron-sidecar:8080/validate
      - PEPPOL_AP_ENDPOINT=http://peppol-accesspoint:8080
    volumes:
      - ./data:/data
    networks:
      - backend_net
    depends_on:
      - schematron-sidecar

  schematron-sidecar:
    image: ghcr.io/adlanegrm-oss/schematron-validator:1.0
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - backend_net # Totalement isolé sur le réseau interne
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M

  peppol-accesspoint:
    image: oxalis/oxalis:latest
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - backend_net
