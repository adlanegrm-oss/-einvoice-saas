version: '3.8'

services:
  einvoice-saas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: einvoice-saas-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
